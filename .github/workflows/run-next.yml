name: run next

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      job_token:
        required: false
        type: string
      owner:
        required: true
        type: string
      repo:
        required: true
        type: string
      slug:
        required: true
        type: string
      branch:
        required: false
        type: string
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Cold OpenNext can exceed 12m; npm cache keeps warm runs under this.
    timeout-minutes: 20
    env:
      AFT_RUN_SRC: ${{ runner.temp }}/aft-run-src
    steps:
      - name: Runner identity
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_TOKEN_INPUT: ${{ inputs.job_token }}
          AFT_API: https://api.aft.page
        run: |
          set -euo pipefail
          if [ -n "${JOB_TOKEN_INPUT:-}" ]; then
            echo "::add-mask::$JOB_TOKEN_INPUT"
            echo "JOB_TOKEN=$JOB_TOKEN_INPUT" >> "$GITHUB_ENV"
            exit 0
          fi
          aud="${AFT_API}/v1/jobs/${JOB_ID}"
          raw=$(curl -fsSL --get "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --data-urlencode "audience=${aud}" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$raw")
          echo "::add-mask::$token"
          echo "JOB_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/run-next-job.sh

      - name: Clone public repo
        env:
          OWNER: ${{ inputs.owner }}
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
          JOB_ID: ${{ inputs.job_id }}
          SLUG: ${{ inputs.slug }}
          AFT_API: https://api.aft.page
        run: |
          set -euo pipefail
          SRC="${AFT_RUN_SRC}"
          rm -rf "$SRC"
          git clone --depth 1 --branch "$BRANCH" "https://github.com/${OWNER}/${REPO}.git" "$SRC" \
            || git clone --depth 1 "https://github.com/${OWNER}/${REPO}.git" "$SRC"
          # Patch job so the UI shows cloning done before npm cache restore.
          python3 - <<'PY'
          import json, os, urllib.request
          api, job_id, token = os.environ["AFT_API"], os.environ["JOB_ID"], os.environ["JOB_TOKEN"]
          owner, repo, branch = os.environ["OWNER"], os.environ["REPO"], os.environ["BRANCH"]
          body = {"phase": "cloning", "line": f"Cloned {owner}/{repo}@{branch}"}
          req = urllib.request.Request(
              f"{api}/v1/jobs/{job_id}",
              data=json.dumps(body).encode(),
              method="PATCH",
              headers={
                  "authorization": f"Bearer {token}",
                  "content-type": "application/json",
                  "user-agent": "aft.page-run-next",
              },
          )
          try:
              urllib.request.urlopen(req, timeout=30).read()
          except Exception as e:
              print(e)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ${{ runner.temp }}/aft-run-src/package-lock.json
            ${{ runner.temp }}/aft-run-src/npm-shrinkwrap.json
            ${{ runner.temp }}/aft-run-src/yarn.lock
            ${{ runner.temp }}/aft-run-src/pnpm-lock.yaml

      - name: Next.js build
        env:
          JOB_ID: ${{ inputs.job_id }}
          OWNER: ${{ inputs.owner }}
          REPO: ${{ inputs.repo }}
          SLUG: ${{ inputs.slug }}
          BRANCH: ${{ inputs.branch }}
          AFT_API: https://api.aft.page
          SKIP_CLONE: "1"
          AFT_RUN_SRC: ${{ runner.temp }}/aft-run-src
        run: |
          chmod +x scripts/run-next-job.sh
          scripts/run-next-job.sh build

      - name: Deploy Worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          SLUG: ${{ inputs.slug }}
          AFT_API: https://api.aft.page
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "44255ec64e0080b678670b53bf810d27"
          AFT_RUN_SRC: ${{ runner.temp }}/aft-run-src
        run: scripts/run-next-job.sh deploy

      - name: Mark job failed
        if: failure() || cancelled()
        env:
          AFT_API: https://api.aft.page
          JOB_ID: ${{ inputs.job_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          api, job_id, token = os.environ["AFT_API"], os.environ["JOB_ID"], os.environ["JOB_TOKEN"]
          body = {
              "phase": "failed",
              "reason": "GitHub Actions failed or timed out (20 min).",
              "line": "runner failed or cancelled",
          }
          req = urllib.request.Request(
              f"{api}/v1/jobs/{job_id}",
              data=json.dumps(body).encode(),
              method="PATCH",
              headers={
                  "authorization": f"Bearer {token}",
                  "content-type": "application/json",
                  "user-agent": "aft.page-run-next",
              },
          )
          try:
              urllib.request.urlopen(req, timeout=30).read()
          except Exception as e:
              print(e)
          PY
