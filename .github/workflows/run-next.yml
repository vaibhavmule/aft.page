name: run next

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      job_token:
        required: true
        type: string
      owner:
        required: true
        type: string
      repo:
        required: true
        type: string
      slug:
        required: true
        type: string
      branch:
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/run-next-job.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone and OpenNext build
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_TOKEN: ${{ inputs.job_token }}
          OWNER: ${{ inputs.owner }}
          REPO: ${{ inputs.repo }}
          SLUG: ${{ inputs.slug }}
          BRANCH: ${{ inputs.branch }}
          AFT_API: https://api.aft.page
        run: |
          chmod +x scripts/run-next-job.sh
          scripts/run-next-job.sh build

      - name: Deploy Worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_TOKEN: ${{ inputs.job_token }}
          SLUG: ${{ inputs.slug }}
          AFT_API: https://api.aft.page
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "44255ec64e0080b678670b53bf810d27"
        run: scripts/run-next-job.sh deploy

      - name: Mark job failed
        if: failure() || cancelled()
        env:
          AFT_API: https://api.aft.page
          JOB_ID: ${{ inputs.job_id }}
          JOB_TOKEN: ${{ inputs.job_token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          api, job_id, token = os.environ["AFT_API"], os.environ["JOB_ID"], os.environ["JOB_TOKEN"]
          body = {
              "phase": "failed",
              "reason": "GitHub Actions failed or timed out (12 min).",
              "line": "runner failed or cancelled",
          }
          req = urllib.request.Request(
              f"{api}/v1/jobs/{job_id}",
              data=json.dumps(body).encode(),
              method="PATCH",
              headers={
                  "authorization": f"Bearer {token}",
                  "content-type": "application/json",
                  "user-agent": "aft.page-run-next",
              },
          )
          try:
              urllib.request.urlopen(req, timeout=30).read()
          except Exception as e:
              print(e)
          PY
