<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share checklist — small software</title>
  <style>
    body { font-family: "DM Sans", system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; background: #fafaf9; color: #1c1917; }
    h1 { font-family: Georgia, serif; }
    li { margin: 0.5rem 0; }
    label { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Doc-simple share checklist</h1>
  <p>Built for a design-partner conversation: prove an app can be shared like a Google Doc on aft.page.</p>
  <ul id="list">
    <li><label><input type="checkbox" /> Deploy from agent output</label></li>
    <li><label><input type="checkbox" /> Claim ownership (magic link)</label></li>
    <li><label><input type="checkbox" /> Set private + invite a teammate</label></li>
    <li><label><input type="checkbox" /> Teammate opens the same URL</label></li>
    <li><label><input type="checkbox" /> Redeploy without breaking the link</label></li>
  </ul>
  <p><small>State is local to this browser (static demo). Full-stack state is the OpenNext / worker track.</small></p>
  <script>
    const key = "aft-share-checklist";
    const saved = JSON.parse(localStorage.getItem(key) || "[]");
    document.querySelectorAll("#list input").forEach((el, i) => {
      el.checked = Boolean(saved[i]);
      el.addEventListener("change", () => {
        const next = [...document.querySelectorAll("#list input")].map((x) => x.checked);
        localStorage.setItem(key, JSON.stringify(next));
      });
    });
  </script>
</body>
</html>
