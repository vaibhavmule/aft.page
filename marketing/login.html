<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — aft.page</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --ink: #14110f;
        --paper: #f1efe8;
        --quiet: #5c554c;
        --signal: #c45c26;
        --line: rgba(20, 17, 15, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      header a {
        color: inherit;
        text-decoration: none;
        font-weight: 650;
      }
      header a span { color: var(--signal); }
      header .nav-right {
        margin-left: auto;
        display: flex;
        gap: 1rem;
        font-size: 0.9rem;
        font-weight: 550;
      }
      header .nav-right a { font-weight: 550; color: var(--quiet); }
      main { max-width: 22rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
      h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
      .sub { color: var(--quiet); margin: 0 0 1.5rem; font-size: 0.92rem; }
      label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      input[type="email"] {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        font: inherit;
        background: #fff;
      }
      button {
        margin-top: 0.85rem;
        width: 100%;
        border: none;
        border-radius: 0.4rem;
        padding: 0.65rem 1rem;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        background: var(--ink);
        color: var(--paper);
      }
      button:disabled { opacity: 0.55; cursor: default; }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem 0.9rem;
        border-radius: 0.4rem;
        font-size: 0.9rem;
        display: none;
      }
      .msg.ok { display: block; background: #eef8f1; color: #1a7f4b; }
      .msg.err { display: block; background: #fdeeee; color: #8a1f1f; }
      .hint { margin-top: 1.5rem; font-size: 0.85rem; color: var(--quiet); }
      .hint a { color: var(--signal); }
    </style>
  </head>
  <body>
    <header>
      <a href="/">aft<span>.</span>page</a>
      <div class="nav-right">
        <a href="/inventory">Your sites</a>
        <a href="/paste-html/">Paste HTML</a>
      </div>
    </header>
    <main>
      <h1>Log in</h1>
      <p class="sub">Magic link to your email — then your inventory.</p>
      <form id="form">
        <label for="email">Work email</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
          placeholder="you@company.com"
        />
        <button type="submit" id="submit">Send login link</button>
      </form>
      <div class="msg" id="msg" role="status"></div>
      <p class="hint">
        New here? <a href="/paste-html/">Paste HTML</a> for a live URL, then
        claim from <a href="/preview">preview</a>, or log in after you own a site.
      </p>
    </main>
    <script>
      const API = "https://api.aft.page";
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      const submit = document.getElementById("submit");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "msg";
        msg.textContent = "";
        submit.disabled = true;
        const email = document.getElementById("email").value.trim();
        try {
          const res = await fetch(`${API}/v1/auth/start`, {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            msg.className = "msg err";
            msg.textContent =
              body.hint || body.message || body.error || "Could not send email";
            return;
          }
          msg.className = "msg ok";
          msg.textContent = "Check your email for a login link (15 minutes).";
          form.reset();
        } catch (err) {
          msg.className = "msg err";
          msg.textContent = String(err);
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
