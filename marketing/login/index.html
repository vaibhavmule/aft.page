<!DOCTYPE html>
<html lang="en">
<!-- deploy-bump -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — aft.page</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#07080a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --void: #07080a;
        --panel: #101218;
        --ink: #f2f4f7;
        --quiet: #8b939e;
        --line: #1e232c;
        --beacon: #e85d1a;
        --beacon-bright: #ff7a3d;
        --good: #3dd68c;
        --danger: #ff6b6b;
        --font-sans: "DM Sans", "Segoe UI", sans-serif;
        --font-display: "Fraunces", "Times New Roman", serif;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: var(--font-sans);
        color: var(--ink);
        background: var(--void);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(20rem, 28rem);
      }
      .brand {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem 2rem 2rem;
        overflow: hidden;
        background:
          radial-gradient(ellipse 80% 60% at 10% 20%, rgba(232, 93, 26, 0.22), transparent 55%),
          radial-gradient(ellipse 70% 50% at 90% 80%, rgba(11, 42, 74, 0.55), transparent 50%),
          linear-gradient(165deg, #0c0e12 0%, #07080a 45%, #0a1218 100%);
      }
      .brand::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(242, 244, 247, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(242, 244, 247, 0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 70% 70% at 40% 40%, #000 20%, transparent 75%);
        pointer-events: none;
      }
      .logo {
        position: relative;
        z-index: 1;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }
      .logo span { color: var(--beacon); }
      .brand-body {
        position: relative;
        z-index: 1;
        max-width: 28rem;
        padding: 3rem 0 4rem;
        animation: rise 0.55s ease both;
      }
      .brand-body h1 {
        margin: 0 0 0.85rem;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(2rem, 4vw, 2.75rem);
        line-height: 1.12;
        letter-spacing: -0.03em;
      }
      .brand-body p {
        margin: 0;
        color: var(--quiet);
        font-size: 1.05rem;
        line-height: 1.55;
        max-width: 24rem;
      }
      .brand-foot {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem 1.25rem;
        color: var(--quiet);
        font-size: 0.82rem;
        font-family: var(--font-mono);
        animation: rise 0.55s ease 0.08s both;
      }
      .brand-foot strong {
        color: var(--ink);
        font-weight: 500;
      }
      .panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem 1.75rem;
        background: var(--panel);
        border-left: 1px solid var(--line);
        animation: rise 0.45s ease 0.05s both;
      }
      .panel-inner { width: 100%; max-width: 22rem; margin: 0 auto; }
      .panel h2 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 0 0 1.5rem;
        color: var(--quiet);
        font-size: 0.92rem;
        line-height: 1.5;
      }
      .sub .host {
        display: block;
        margin: 0.35rem 0 0.65rem;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 1rem;
        line-height: 1.35;
        word-break: break-all;
      }
      .sub .host .slug {
        color: var(--beacon-bright);
        font-weight: 600;
      }
      .sub .host .dot {
        color: var(--quiet);
      }
      .sub .host .root {
        color: var(--quiet);
      }
      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 0.4rem;
        color: var(--quiet);
      }
      input[type="email"] {
        width: 100%;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: 0.45rem;
        font: inherit;
        font-size: 0.95rem;
        color: var(--ink);
        background: #0b0d11;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input[type="email"]::placeholder { color: #5a616c; }
      input[type="email"]:focus {
        outline: none;
        border-color: color-mix(in srgb, var(--beacon) 70%, var(--line));
        box-shadow: 0 0 0 3px rgba(232, 93, 26, 0.18);
      }
      button {
        margin-top: 0.9rem;
        width: 100%;
        border: none;
        border-radius: 0.45rem;
        padding: 0.75rem 1rem;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        background: var(--beacon);
        color: #140c08;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: transform 0.12s ease, filter 0.12s ease;
      }
      button:hover:not(:disabled) { filter: brightness(1.06); }
      button:active:not(:disabled) { transform: scale(0.98); }
      button:disabled { opacity: 0.65; cursor: default; }
      .spinner {
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 999px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        animation: spin 0.65s linear infinite;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem 0.9rem;
        border-radius: 0.45rem;
        font-size: 0.88rem;
        display: none;
        border: 1px solid transparent;
      }
      .msg.ok, .msg.err {
        display: block;
        animation: rise 0.25s ease both;
      }
      .msg.ok {
        background: color-mix(in srgb, var(--good) 12%, transparent);
        border-color: color-mix(in srgb, var(--good) 35%, transparent);
        color: var(--good);
      }
      .msg.err {
        background: color-mix(in srgb, var(--danger) 12%, transparent);
        border-color: color-mix(in srgb, var(--danger) 35%, transparent);
        color: var(--danger);
      }
      .hint {
        margin: 1.5rem 0 0;
        font-size: 0.82rem;
        color: var(--quiet);
        line-height: 1.45;
      }
      .hint a {
        color: var(--beacon-bright);
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }
      .back {
        display: inline-block;
        margin-bottom: 1.75rem;
        font-size: 0.82rem;
        color: var(--quiet);
      }
      .back:hover { color: var(--ink); }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 820px) {
        .shell { grid-template-columns: 1fr; }
        .brand {
          min-height: auto;
          padding: 1.25rem 1.25rem 1.5rem;
        }
        .brand-body {
          padding: 1.75rem 0 1.25rem;
        }
        .brand-body h1 { font-size: 1.75rem; }
        .brand-foot { display: none; }
        .panel {
          border-left: none;
          border-top: 1px solid var(--line);
          padding: 1.75rem 1.25rem 2.5rem;
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .brand-body, .brand-foot, .panel, .msg.ok, .msg.err, .spinner, button {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="brand" aria-hidden="false">
        <a class="logo" href="/">aft<span>.</span>page</a>
        <div class="brand-body">
          <h1>Ship it. Share it. Gate it.</h1>
          <p>
            Live URLs for internal tools — company login and invites without
            bolting auth onto every app yourself.
          </p>
        </div>
        <div class="brand-foot">
          <span><strong>deploy</strong> → live link</span>
          <span><strong>invite</strong> → teammate</span>
          <span><strong>revoke</strong> → done</span>
        </div>
      </aside>
      <main class="panel">
        <div class="panel-inner">
          <a class="back" href="/">← aft.page</a>
          <h2 id="title">Log in</h2>
          <p class="sub" id="sub">Magic link to your email — no password.</p>
          <form id="form">
            <label for="email">Work email</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@company.com"
              autofocus
            />
            <button type="submit" id="submit">
              <span class="label">Send login link</span>
            </button>
          </form>
          <div class="msg" id="msg" role="status"></div>
          <p class="hint" id="hint" hidden></p>
        </div>
      </main>
    </div>
    <script>
      const API = "https://api.aft.page";
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      const submit = document.getElementById("submit");
      const label = submit.querySelector(".label");
      const titleEl = document.getElementById("title");
      const subEl = document.getElementById("sub");
      const hintEl = document.getElementById("hint");
      const nextParam = new URLSearchParams(location.search).get("next") || "";

      function accessTarget(next) {
        if (!next) return null;
        try {
          const u = new URL(next, location.origin);
          if (u.hostname === "aft.page" || u.hostname.endsWith(".aft.page")) {
            if (u.pathname.startsWith("/preview")) {
              const site = u.searchParams.get("url") || "";
              const m = site.match(
                /^https:\/\/([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.aft\.page/i,
              );
              return m ? `${m[1].toLowerCase()}.aft.page` : "this site";
            }
            if (
              u.pathname === "/project" ||
              u.pathname === "/project/" ||
              u.pathname.startsWith("/projects/")
            ) {
              const slug = u.searchParams.get("slug");
              if (slug && /^[a-z0-9-]+$/.test(slug)) {
                return `${slug}.aft.page`;
              }
              return "this project";
            }
            if (u.hostname !== "aft.page" && u.hostname !== "www.aft.page") {
              return u.hostname;
            }
            if (u.pathname === "/" || u.pathname === "") return null;
            return "this page";
          }
        } catch (_) {}
        return null;
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      /** Highlight slug in beacon; keep .aft.page quieter. */
      function hostHtml(hostname) {
        const m = hostname.match(
          /^([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.(aft\.page)$/i,
        );
        if (m) {
          return (
            `<span class="host" aria-label="${escapeHtml(hostname)}">` +
            `<span class="slug">${escapeHtml(m[1].toLowerCase())}</span>` +
            `<span class="dot">.</span>` +
            `<span class="root">${escapeHtml(m[2].toLowerCase())}</span>` +
            `</span>`
          );
        }
        return `<span class="host"><span class="slug">${escapeHtml(hostname)}</span></span>`;
      }

      const target = accessTarget(nextParam);
      let ctaLabel = "Send login link";
      let okMsg = "Check your email for a login link (15 minutes).";
      if (target) {
        document.title = "Access — aft.page";
        titleEl.textContent = "Continue";
        if (target === "this page" || target === "this site" || target === "this project") {
          subEl.textContent =
            "Sign in with a magic link to open this project.";
        } else {
          subEl.innerHTML =
            `${hostHtml(target)}Sign in to manage this project.`;
        }
        ctaLabel = "Send login link";
        label.textContent = ctaLabel;
        okMsg = "Check your email for a login link (15 minutes).";
        hintEl.hidden = false;
        hintEl.textContent =
          "Use the email you were invited with.";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "msg";
        msg.textContent = "";
        submit.disabled = true;
        label.innerHTML =
          `<span class="spinner" aria-hidden="true"></span> Sending…`;
        const email = document.getElementById("email").value.trim();
        try {
          const payload = { email };
          if (nextParam) payload.next = nextParam;
          const res = await fetch(`${API}/v1/auth/start`, {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            msg.className = "msg err";
            msg.textContent =
              body.hint || body.message || body.error || "Could not send email";
            return;
          }
          msg.className = "msg ok";
          msg.textContent = okMsg;
          form.reset();
        } catch (err) {
          msg.className = "msg err";
          msg.textContent = String(err);
        } finally {
          submit.disabled = false;
          label.textContent = ctaLabel;
        }
      });
    </script>
  </body>
</html>
