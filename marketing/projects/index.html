<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects — aft.page</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#07080a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
    <style>
      main { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
        align-items: center;
        justify-content: space-between;
      }
      .toolbar .meta {
        margin-left: 0;
        order: -1;
        flex: 1 1 auto;
      }
      .head-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .head-row h1 { margin: 0; flex: 1 1 auto; }
      .head-row .btn { margin-left: auto; }
      th.actions-col, td.actions { width: 2.5rem; text-align: right; }
      .meta {
        margin-left: auto;
        font-size: 0.82rem;
        color: var(--quiet);
      }
      .actions { display: flex; flex-wrap: wrap; gap: 0.35rem; }
      tbody tr {
        opacity: 0;
        animation: app-fade-up 0.32s ease forwards;
      }
      tbody tr:nth-child(1) { animation-delay: 0.02s; }
      tbody tr:nth-child(2) { animation-delay: 0.05s; }
      tbody tr:nth-child(3) { animation-delay: 0.08s; }
      tbody tr:nth-child(4) { animation-delay: 0.11s; }
      tbody tr:nth-child(5) { animation-delay: 0.14s; }
      tbody tr:nth-child(n + 6) { animation-delay: 0.17s; }
      .who {
        font-size: 0.85rem;
        color: var(--quiet);
        margin-bottom: 0.75rem;
        animation: app-fade-up 0.28s ease both;
      }
      .pager {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem;
        margin-top: 1rem;
        padding-top: 0.85rem;
        border-top: 1px solid var(--line);
      }
      .pager-status {
        font-size: 0.82rem;
        color: var(--quiet);
        margin-right: auto;
      }
      .pager-btns { display: flex; gap: 0.4rem; }
      a.btn, button.btn { font-size: 0.78rem; padding: 0.3rem 0.55rem; }
    </style>
  </head>
  <body>
    <header>
      <a href="/">aft<span>.</span>page</a>
      <div class="nav-right">
        <a href="/projects" aria-current="page">Projects</a>
        <a href="/mcp">MCP</a>
        <a href="/login" data-aft-auth="login">Log in</a>
      </div>
    </header>
    <main>
      <div class="head-row">
        <h1>Projects</h1>
        <a class="btn" id="new-project" href="/projects/new/" hidden>New project</a>
      </div>
      <div class="toolbar" id="toolbar" hidden>
        <span class="meta" id="meta"></span>
      </div>
      <div class="loading" id="loading" aria-busy="true" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <div>
          <div>Loading projects…</div>
          <div class="skeleton-list" aria-hidden="true">
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
          </div>
        </div>
      </div>
      <div class="login" id="login" hidden>
        <p>Sign in with a magic link to see your projects.</p>
        <a class="primary" href="/login">Log in</a>
        <p style="margin: 0.85rem 0 0; font-size: 0.88rem">
          Or claim a site from <a href="/preview">preview</a> after deploy.
        </p>
      </div>
      <div class="empty" id="empty" hidden>
        No projects yet.
        <a href="/projects/new/">Create one</a>
        or deploy via MCP then claim from preview.
      </div>
      <div id="list" hidden>
        <table id="table">
          <thead>
            <tr>
              <th>Project</th>
              <th>Visibility</th>
              <th>Last used</th>
              <th class="actions-col"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="pager" id="pager" hidden>
          <span class="pager-status" id="pager-status"></span>
          <div class="pager-btns">
            <button type="button" class="btn ghost" id="prev" disabled>Previous</button>
            <button type="button" class="btn ghost" id="next" disabled>Next</button>
          </div>
        </div>
      </div>
    </main>
    <script>
      const API = "https://api.aft.page";
      const PAGE_SIZE = 20;
      /** Soft TTL for client cache — revalidate in background after this. */
      const CACHE_TTL_MS = 60_000;
      const CACHE_KEY = "aft.projects.sites.v1";
      const login = document.getElementById("login");
      const empty = document.getElementById("empty");
      const list = document.getElementById("list");
      const tbody = document.getElementById("tbody");
      const toolbar = document.getElementById("toolbar");
      const loading = document.getElementById("loading");
      const meta = document.getElementById("meta");
      const newProject = document.getElementById("new-project");
      const pager = document.getElementById("pager");
      const pagerStatus = document.getElementById("pager-status");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");

      /** @type {Map<number, { data: object, at: number }>} */
      const memoryCache = new Map();
      let page = Math.max(
        1,
        Number(new URLSearchParams(location.search).get("page") || "1") || 1,
      );
      let loadGen = 0;
      /** @type {Set<number>} */
      const inflightPrefetch = new Set();
      let openMenu = null;

      function closeMenus() {
        if (openMenu) {
          openMenu.classList.remove("open");
          const b = openMenu.querySelector(".menu-btn");
          if (b) b.setAttribute("aria-expanded", "false");
          openMenu = null;
        }
      }

      document.addEventListener("click", closeMenus);

      function reveal(el) {
        el.hidden = false;
        el.classList.add("fade-in");
      }

      function setUrlPage(p) {
        const url = new URL(location.href);
        if (p <= 1) url.searchParams.delete("page");
        else url.searchParams.set("page", String(p));
        history.replaceState(null, "", url.pathname + url.search);
      }

      function readSessionCache() {
        try {
          const raw = sessionStorage.getItem(CACHE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return;
          for (const [k, v] of Object.entries(parsed)) {
            const p = Number(k);
            if (!Number.isFinite(p) || !v?.data || !v?.at) continue;
            memoryCache.set(p, v);
          }
        } catch (_) {
          /* ignore quota / parse */
        }
      }

      function writeSessionCache() {
        try {
          const out = {};
          for (const [p, entry] of memoryCache) {
            out[String(p)] = entry;
          }
          sessionStorage.setItem(CACHE_KEY, JSON.stringify(out));
        } catch (_) {
          /* ignore quota */
        }
      }

      function getCached(p) {
        return memoryCache.get(p) || null;
      }

      function setCached(p, data) {
        memoryCache.set(p, { data, at: Date.now() });
        writeSessionCache();
      }

      function clearCache() {
        memoryCache.clear();
        try {
          sessionStorage.removeItem(CACHE_KEY);
        } catch (_) {
          /* ignore */
        }
      }

      function isFresh(entry) {
        return entry && Date.now() - entry.at < CACHE_TTL_MS;
      }

      function renderRows(sites) {
        tbody.replaceChildren();
        closeMenus();
        for (const s of sites) {
          const tr = document.createElement("tr");
          const last = s.lastServedAt
            ? new Date(s.lastServedAt).toLocaleString()
            : "—";
          const live = s.url || `https://${s.slug}.aft.page`;
          const preview =
            s.preview ||
            `https://aft.page/preview?url=${encodeURIComponent(live)}`;
          const manage = `/project/?slug=${encodeURIComponent(s.slug)}`;

          const nameTd = document.createElement("td");
          nameTd.innerHTML = `
            <a href="${manage}" style="color:inherit;text-decoration:none">
              <strong>${s.slug}</strong>
            </a>
            <div style="font-size:0.78rem;color:var(--quiet);margin-top:0.2rem">
              <code>${(s.deployId || "").slice(0, 12)}</code>
            </div>`;

          const visTd = document.createElement("td");
          visTd.innerHTML = `<span class="pill ${s.visibility === "private" ? "private" : ""}">${s.visibility}</span>`;

          const lastTd = document.createElement("td");
          lastTd.textContent = last;

          const actTd = document.createElement("td");
          actTd.className = "actions";
          const menu = document.createElement("div");
          menu.className = "menu";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "menu-btn";
          btn.setAttribute("aria-label", `Actions for ${s.slug}`);
          btn.setAttribute("aria-haspopup", "menu");
          btn.setAttribute("aria-expanded", "false");
          btn.textContent = "⋯";
          const panel = document.createElement("div");
          panel.className = "menu-panel";
          panel.setAttribute("role", "menu");
          panel.innerHTML = `
            <a role="menuitem" href="${manage}">Manage</a>
            <a role="menuitem" href="${live}" target="_blank" rel="noopener">Open</a>
            <a role="menuitem" href="${preview}">Preview</a>`;
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const willOpen = !menu.classList.contains("open");
            closeMenus();
            if (willOpen) {
              menu.classList.add("open");
              openMenu = menu;
              btn.setAttribute("aria-expanded", "true");
            }
          });
          menu.append(btn, panel);
          actTd.appendChild(menu);

          tr.append(nameTd, visTd, lastTd, actTd);
          tbody.appendChild(tr);
        }
      }

      function renderPager(data) {
        const total = data.total || 0;
        const totalPages = data.totalPages || 1;
        const current = data.page || 1;
        const limit = data.limit || PAGE_SIZE;
        if (total <= limit) {
          pager.hidden = true;
          meta.textContent = total === 1 ? "1 project" : `${total} projects`;
          return;
        }
        pager.hidden = false;
        const from = (current - 1) * limit + 1;
        const to = Math.min(current * limit, total);
        pagerStatus.textContent = `${from}–${to} of ${total}`;
        meta.textContent = `${total} projects · page ${current}/${totalPages}`;
        prevBtn.disabled = current <= 1;
        nextBtn.disabled = !data.hasMore && current >= totalPages;
      }

      function applyData(data, p) {
        const sites = data.sites || [];
        reveal(toolbar);
        newProject.hidden = false;
        if (!(data.total > 0)) {
          list.hidden = true;
          reveal(empty);
          return false;
        }
        empty.hidden = true;
        if (p > (data.totalPages || 1) && data.totalPages >= 1) {
          return "redirect";
        }
        reveal(list);
        renderRows(sites);
        renderPager(data);
        return true;
      }

      async function fetchPage(p) {
        const res = await fetch(
          `${API}/v1/me/sites?page=${p}&limit=${PAGE_SIZE}`,
          { credentials: "include" },
        );
        if (res.status === 401) return { status: 401 };
        if (!res.ok) return { status: res.status };
        const data = await res.json();
        setCached(p, data);
        return { status: 200, data };
      }

      function prefetch(p) {
        if (p < 1 || inflightPrefetch.has(p)) return;
        const cached = getCached(p);
        if (isFresh(cached)) return;
        inflightPrefetch.add(p);
        fetchPage(p)
          .catch(() => {})
          .finally(() => inflightPrefetch.delete(p));
      }

      function showAuthError() {
        clearCache();
        if (window.aftAuth) window.aftAuth.clearMe();
        loading.hidden = true;
        list.hidden = true;
        toolbar.hidden = true;
        newProject.hidden = true;
        empty.hidden = true;
        reveal(login);
      }

      async function load(p = page, opts = {}) {
        const { force = false } = opts;
        const gen = ++loadGen;
        page = p;
        setUrlPage(page);
        login.hidden = true;

        const cached = !force ? getCached(page) : null;
        const haveCache = Boolean(cached?.data);

        if (haveCache) {
          loading.hidden = true;
          const result = applyData(cached.data, page);
          if (result === "redirect") return load(cached.data.totalPages, { force });
          if (isFresh(cached) && !force) {
            const totalPages = cached.data.totalPages || 1;
            if (page < totalPages) prefetch(page + 1);
            if (page > 1) prefetch(page - 1);
            return;
          }
        } else {
          loading.hidden = false;
          empty.hidden = true;
          list.hidden = true;
          toolbar.hidden = true;
        }

        try {
          const result = await fetchPage(page);
          if (gen !== loadGen) return;
          loading.hidden = true;
          if (result.status === 401) {
            showAuthError();
            return;
          }
          if (result.status !== 200) {
            if (!haveCache) {
              showAuthError();
              login.innerHTML =
                "<p>Couldn’t load projects.</p><a class=\"primary\" href=\"/login\">Log in</a>";
            }
            return;
          }
          const data = result.data;
          const applied = applyData(data, page);
          if (applied === "redirect") return load(data.totalPages, { force });
          const totalPages = data.totalPages || 1;
          if (page < totalPages) prefetch(page + 1);
          if (page > 1) prefetch(page - 1);
        } catch (_) {
          if (gen !== loadGen) return;
          loading.hidden = true;
          if (!haveCache) {
            showAuthError();
            login.innerHTML =
              "<p>Couldn’t load projects.</p><a class=\"primary\" href=\"/login\">Log in</a>";
          }
        }
      }

      prevBtn.addEventListener("click", () => {
        if (page > 1) load(page - 1);
      });
      nextBtn.addEventListener("click", () => load(page + 1));
      readSessionCache();
      load(page);
    </script>
    <script src="/auth-me.js" defer></script>
    <script src="/auth-nav.js" defer></script>
  </body>
</html>
