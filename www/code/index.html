<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code — aft.page</title>
    <meta
      name="description"
      content="Prompt or template → static site → live URL. Ask aft to build a site."
    />
    <link rel="canonical" href="https://aft.page/code/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="aft.page" />
    <meta property="og:title" content="Code — aft.page" />
    <meta
      property="og:description"
      content="Prompt or template → static site → live URL."
    />
    <meta property="og:url" content="https://aft.page/code/" />
    <meta property="og:image" content="https://aft.page/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Code — aft.page" />
    <meta
      name="twitter:description"
      content="Ask aft to build a site. Live URL on aft.page."
    />
    <meta name="twitter:image" content="https://aft.page/og.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.5/index.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.5/index.min.css"
    />
    <link rel="stylesheet" href="/app.css" />
    <style>
      html { overflow-x: clip; }
      body { margin: 0; min-height: 100dvh; overflow-x: clip; }
      .code-shell { min-height: 100dvh; display: flex; flex-direction: column; }
      .code-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      .code-bar a { color: var(--ink); text-decoration: none; font-weight: 650; letter-spacing: -0.03em; }
      .code-bar a span { opacity: 0.45; }
      .code-bar-title { margin: 0; font-size: 0.88rem; color: var(--quiet); }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 40rem;
        width: 100%;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
        box-sizing: border-box;
        min-width: 0;
      }
      .code-title {
        margin: 0 0 0.35rem;
        font-size: clamp(1.75rem, 4vw, 2.35rem);
        letter-spacing: -0.04em;
        font-weight: 650;
      }
      .code-lede { margin: 0 0 1.5rem; color: var(--quiet); font-size: 0.95rem; }
      .prompt-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        border: 1px solid var(--line-bright);
        border-radius: 0.65rem;
        background: var(--panel);
        padding: 0.45rem;
      }
      .prompt-row input {
        flex: 1 1 12rem;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 0.95rem;
        padding: 0.7rem 0.75rem;
      }
      .prompt-row input:focus { outline: none; }
      .prompt-row .btn { flex: 0 0 auto; }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.85rem;
      }
      .pill {
        appearance: none;
        border: 1px solid var(--line-bright);
        background: var(--void);
        color: var(--ink);
        font: inherit;
        font-size: 0.82rem;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        cursor: pointer;
      }
      .pill:hover, .pill:focus-visible { border-color: var(--ink); }
      .pill:disabled { opacity: 0.5; cursor: default; }
      .msg {
        margin: 1rem 0 0;
        font-size: 0.9rem;
        min-height: 1.25em;
      }
      .msg.err { color: var(--danger); }
      .msg.ok { color: var(--good); }
      .msg.pending { color: var(--quiet); }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="code-shell">
      <header class="code-bar">
        <a href="/">aft<span>.</span>page</a>
        <p class="code-bar-title">Code</p>
        <a href="/drop/">Drop</a>
      </header>
      <main>
        <h1 class="code-title">Code</h1>
        <p class="code-lede">Prompt → static site → live URL. Tables and files later.</p>
        <form id="prompt-form">
          <div class="prompt-row">
            <label class="visually-hidden" for="prompt">Describe the site</label>
            <input
              id="prompt"
              name="prompt"
              type="text"
              autocomplete="off"
              placeholder="Ask aft to build a site"
            />
            <button type="submit" class="btn" id="prompt-go">Go</button>
          </div>
        </form>
        <div class="pills" role="group" aria-label="Templates">
          <button type="button" class="pill" data-template="todo">Todo</button>
          <button type="button" class="pill" data-template="contact">Contact form</button>
          <button type="button" class="pill" data-template="tracker">Tracker</button>
        </div>
        <p class="msg" id="status" role="status" aria-live="polite"></p>
      </main>
    </div>
    <script src="/auth-me.js"></script>
    <script src="/code.js"></script>
    <script src="/progress.js" defer></script>
  </body>
</html>
