<!DOCTYPE html>
<html lang="en">
<!-- deploy-bump -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — aft.page</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.5/index.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.5/index.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --void: #000000;
        --panel: #0a0a0a;
        --ink: #fafafa;
        --quiet: #a1a1aa;
        --line: #27272a;
        --cta: #ffffff;
        --cta-ink: #000000;
        --cta-hover: #e4e4e7;
        --beacon: var(--cta);
        --beacon-bright: #22c55e;
        --good: #22c55e;
        --danger: #ff6b6b;
        --font-sans: "Geist Variable", "Geist", "Segoe UI", system-ui, sans-serif;
        --font-display: var(--font-sans);
        --font-mono: "Geist Mono Variable", "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        font-family: var(--font-sans);
        color: var(--ink);
        background: var(--void);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      .auth-rail {
        flex-shrink: 0;
        border-bottom: 1px solid var(--line);
      }
      .auth-rail-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        width: min(1180px, calc(100% - 2.5rem));
        margin: 0 auto;
        padding: 1.35rem clamp(1.25rem, 3vw, 2.25rem);
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .auth-cta {
        display: inline-flex;
        align-items: center;
        padding: 0.45rem 0.95rem;
        border-radius: 0.5rem;
        background: var(--cta);
        border: 1px solid var(--cta);
        color: var(--cta-ink);
        font-size: 0.88rem;
        font-weight: 600;
      }
      .auth-cta:hover { background: var(--cta-hover); border-color: var(--cta-hover); }
      .shell {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(20rem, 28rem);
      }
      .brand {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem 2rem 2rem;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 55% at 20% 30%, rgba(250, 250, 250, 0.05), transparent 65%),
          linear-gradient(180deg, #000000 0%, #0a0a0a 50%, #000000 100%);
      }
      .brand::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(242, 244, 247, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(242, 244, 247, 0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 70% 70% at 40% 40%, #000 20%, transparent 75%);
        pointer-events: none;
      }
      .logo-wrap {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
      }
      .logo {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .logo span { color: var(--good); }
      .nav-beta {
        font-family: var(--font-mono);
        font-size: 0.65rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--quiet);
        border: 1px solid var(--line);
        padding: 0.2rem 0.45rem;
        border-radius: 999px;
      }
      .brand-body {
        position: relative;
        z-index: 1;
        max-width: 28rem;
        padding: 3rem 0 4rem;
        animation: rise 0.55s ease both;
      }
      .brand-body h1 {
        margin: 0 0 0.85rem;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(2rem, 4vw, 2.75rem);
        line-height: 1.12;
        letter-spacing: -0.03em;
      }
      .brand-body p {
        margin: 0;
        color: var(--quiet);
        font-size: 1.05rem;
        line-height: 1.55;
        max-width: 24rem;
      }
      .brand-foot {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem 1.25rem;
        color: var(--quiet);
        font-size: 0.82rem;
        font-family: var(--font-mono);
        animation: rise 0.55s ease 0.08s both;
      }
      .brand-foot strong {
        color: var(--ink);
        font-weight: 500;
      }
      .panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem 1.75rem;
        background: var(--panel);
        border-left: 1px solid var(--line);
        animation: rise 0.45s ease 0.05s both;
      }
      .panel-inner { width: 100%; max-width: 22rem; margin: 0 auto; }
      .panel h2 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 0 0 1.5rem;
        color: var(--quiet);
        font-size: 0.92rem;
        line-height: 1.5;
      }
      .sub .host {
        display: block;
        margin: 0.35rem 0 0.65rem;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 1rem;
        line-height: 1.35;
        word-break: break-all;
      }
      .sub .host .slug {
        color: var(--beacon-bright);
        font-weight: 600;
      }
      .sub .host .dot {
        color: var(--quiet);
      }
      .sub .host .root {
        color: var(--quiet);
      }
      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 0.4rem;
        color: var(--quiet);
      }
      input[type="email"] {
        width: 100%;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: 0.45rem;
        font: inherit;
        font-size: 0.95rem;
        color: var(--ink);
        background: #0b0d11;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input[type="email"]::placeholder { color: #5a616c; }
      input[type="email"]:focus {
        outline: none;
        border-color: var(--line-bright, #3f3f46);
        box-shadow: 0 0 0 3px rgba(250, 250, 250, 0.08);
      }
      #submit, .btn-google {
        margin-top: 0.9rem;
        width: 100%;
        border: none;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        background: var(--cta);
        color: var(--cta-ink);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: transform 0.12s ease, background 0.12s ease;
      }
      #submit:hover:not(:disabled) { background: var(--cta-hover); }
      #submit:active:not(:disabled) { transform: scale(0.98); }
      #submit:disabled { opacity: 0.65; cursor: default; }
      .btn-google {
        margin-top: 0;
        margin-bottom: 0.15rem;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        text-decoration: none;
      }
      .btn-google:hover { background: #141414; }
      .btn-google svg { width: 1.1rem; height: 1.1rem; flex-shrink: 0; }
      .or {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 1.05rem 0 0.85rem;
        color: var(--quiet);
        font-size: 0.78rem;
      }
      .or::before, .or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .spinner {
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 999px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        animation: spin 0.65s linear infinite;
      }
      .msg {
        margin-top: 1rem;
        padding: 0.75rem 0.9rem;
        border-radius: 0.45rem;
        font-size: 0.88rem;
        display: none;
        border: 1px solid transparent;
      }
      .msg.ok, .msg.err {
        display: block;
        animation: rise 0.25s ease both;
      }
      .msg.ok {
        background: color-mix(in srgb, var(--good) 12%, transparent);
        border-color: color-mix(in srgb, var(--good) 35%, transparent);
        color: var(--good);
      }
      .msg.err {
        background: color-mix(in srgb, var(--danger) 12%, transparent);
        border-color: color-mix(in srgb, var(--danger) 35%, transparent);
        color: var(--danger);
      }
      .hint {
        margin: 1.5rem 0 0;
        font-size: 0.82rem;
        color: var(--quiet);
        line-height: 1.45;
      }
      .hint a {
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 0.15em;
      }
      .back {
        display: inline-block;
        margin-bottom: 1.75rem;
        font-size: 0.82rem;
        color: var(--quiet);
      }
      .back:hover { color: var(--ink); }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (max-width: 820px) {
        .shell { grid-template-columns: 1fr; }
        .brand {
          min-height: auto;
          padding: 1.25rem 1.25rem 1.5rem;
        }
        .brand-body {
          padding: 1.75rem 0 1.25rem;
        }
        .brand-body h1 { font-size: 1.75rem; }
        .brand-foot { display: none; }
        .panel {
          border-left: none;
          border-top: 1px solid var(--line);
          padding: 1.75rem 1.25rem 2.5rem;
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .brand-body, .brand-foot, .panel, .msg.ok, .msg.err, .spinner, button {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="auth-rail">
      <div class="auth-rail-inner">
        <div class="logo-wrap">
          <a class="logo" href="/">aft<span>.</span>page</a>
          <span class="nav-beta">Beta</span>
        </div>
        <a class="auth-cta" href="/drop">Deploy an app</a>
      </div>
    </header>
    <div class="shell">
      <aside class="brand" aria-hidden="false">
        <div class="brand-body">
          <h1>Ship it. Share it. Gate it.</h1>
          <p>
            Live URLs for internal tools — company login and invites without
            bolting auth onto every app yourself.
          </p>
        </div>
        <div class="brand-foot">
          <span><strong>deploy</strong> → live link</span>
          <span><strong>invite</strong> → teammate</span>
          <span><strong>revoke</strong> → done</span>
        </div>
      </aside>
      <main class="panel">
        <div class="panel-inner">
          <a class="back" href="/">← aft.page</a>
          <h2 id="title">Log in</h2>
          <p class="sub" id="sub" hidden></p>
          <a class="btn-google" id="google" href="https://api.aft.page/v1/auth/google">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
          </a>
          <p class="or">or</p>
          <form id="form">
            <label for="email">Work email</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@company.com"
              autofocus
            />
            <button type="submit" id="submit">
              <span class="label">Send login link</span>
            </button>
          </form>
          <div class="msg" id="msg" role="status"></div>
          <p class="hint" id="hint" hidden></p>
        </div>
      </main>
    </div>
    <script>
      const API = "https://api.aft.page";
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      const submit = document.getElementById("submit");
      const label = submit.querySelector(".label");
      const titleEl = document.getElementById("title");
      const subEl = document.getElementById("sub");
      const hintEl = document.getElementById("hint");
      const googleEl = document.getElementById("google");
      const params = new URLSearchParams(location.search);
      const nextParam = params.get("next") || "";
      const errorParam = params.get("error") || "";

      const googleHref = new URL(`${API}/v1/auth/google`);
      if (nextParam) googleHref.searchParams.set("next", nextParam);
      googleEl.href = googleHref.toString();

      const errorText = {
        google_denied: "Google sign-in was cancelled.",
        google_unverified: "That Google account’s email isn’t verified.",
        google_failed: "Google sign-in failed. Try a magic link instead.",
        google_unavailable: "Google sign-in isn’t available yet. Use a magic link.",
        rate_limited: "Too many sign-in attempts. Try again in a bit.",
      }[errorParam];
      if (errorText) {
        msg.className = "msg err";
        msg.textContent = errorText;
      }

      function accessTarget(next) {
        if (!next) return null;
        try {
          const u = new URL(next, location.origin);
          if (u.hostname === "aft.page" || u.hostname.endsWith(".aft.page")) {
            if (u.pathname.startsWith("/preview")) {
              const site = u.searchParams.get("url") || "";
              const m = site.match(
                /^https:\/\/([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.aft\.page/i,
              );
              return m ? `${m[1].toLowerCase()}.aft.page` : "this site";
            }
            if (
              u.pathname === "/project" ||
              u.pathname === "/project/" ||
              u.pathname.startsWith("/projects/")
            ) {
              const slug = u.searchParams.get("slug");
              if (slug && /^[a-z0-9-]+$/.test(slug)) {
                return `${slug}.aft.page`;
              }
              return "this project";
            }
            if (u.hostname !== "aft.page" && u.hostname !== "www.aft.page") {
              return u.hostname;
            }
            if (u.pathname === "/" || u.pathname === "") return null;
            return "this page";
          }
        } catch (_) {}
        return null;
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      /** Highlight slug in beacon; keep .aft.page quieter. */
      function hostHtml(hostname) {
        const m = hostname.match(
          /^([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.(aft\.page)$/i,
        );
        if (m) {
          return (
            `<span class="host" aria-label="${escapeHtml(hostname)}">` +
            `<span class="slug">${escapeHtml(m[1].toLowerCase())}</span>` +
            `<span class="dot">.</span>` +
            `<span class="root">${escapeHtml(m[2].toLowerCase())}</span>` +
            `</span>`
          );
        }
        return `<span class="host"><span class="slug">${escapeHtml(hostname)}</span></span>`;
      }

      const target = accessTarget(nextParam);
      let ctaLabel = "Send login link";
      let okMsg = "Check your email for a login link (15 minutes).";
      if (target) {
        document.title = "Access — aft.page";
        titleEl.textContent = "Continue";
        subEl.hidden = false;
        if (target === "this page" || target === "this site" || target === "this project") {
          subEl.textContent = "Sign in to open this project.";
        } else {
          subEl.innerHTML =
            `${hostHtml(target)}Sign in to manage this project.`;
        }
        ctaLabel = "Send login link";
        label.textContent = ctaLabel;
        okMsg = "Check your email for a login link (15 minutes).";
        hintEl.hidden = false;
        hintEl.textContent =
          "Use the email you were invited with.";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "msg";
        msg.textContent = "";
        submit.disabled = true;
        label.innerHTML =
          `<span class="spinner" aria-hidden="true"></span> Sending…`;
        const email = document.getElementById("email").value.trim();
        try {
          const payload = { email };
          if (nextParam) payload.next = nextParam;
          const res = await fetch(`${API}/v1/auth/start`, {
            method: "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            msg.className = "msg err";
            msg.textContent =
              body.hint || body.message || body.error || "Could not send email";
            return;
          }
          msg.className = "msg ok";
          msg.textContent = okMsg;
          form.reset();
        } catch (err) {
          msg.className = "msg err";
          msg.textContent = String(err);
        } finally {
          submit.disabled = false;
          label.textContent = ctaLabel;
        }
      });
    </script>
    <script src="/feedback.js?v=20260809-pill" defer></script>
  </body>
</html>
