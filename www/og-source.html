<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og image source — not linked</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.5/index.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.5/index.min.css"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: "Geist Variable", "Geist", "Segoe UI", system-ui, sans-serif;
        color: #fafafa;
        background-color: #000000;
        background-image:
          radial-gradient(ellipse 70% 60% at 8% 0%, rgba(250, 250, 250, 0.07), transparent 55%),
          radial-gradient(circle at 105% 115%, rgba(34, 197, 94, 0.12), transparent 45%),
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: auto, auto, 42px 42px, 42px 42px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        position: relative;
      }
      .brand {
        font-weight: 650;
        font-size: 128px;
        letter-spacing: -0.03em;
        line-height: 0.95;
        margin-bottom: 32px;
      }
      .brand span { color: #22c55e; }
      .lede {
        font-size: 38px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
        max-width: 24ch;
        margin-bottom: 18px;
      }
      .support {
        font-size: 24px;
        font-weight: 400;
        color: #a1a1aa;
        max-width: 38ch;
      }
      .flow {
        position: absolute;
        left: 96px;
        bottom: 56px;
        font-family: "Geist Mono Variable", "Geist Mono", ui-monospace, monospace;
        font-size: 20px;
        color: #52525b;
      }
      .flow b { color: #22c55e; font-weight: 500; }
    </style>
  </head>
  <body>
    <h1 class="brand">aft<span>.</span>page</h1>
    <p class="lede">Turn your agent-built app into a shareable URL</p>
    <p class="support">
      Drop your files or deploy from your agent. No repository, cloud setup, or
      account required.
    </p>
    <p class="flow">agent &rarr; deploy &rarr; <b>live URL</b></p>
