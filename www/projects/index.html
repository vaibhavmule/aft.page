<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects — aft.page</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.5/index.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.5/index.min.css"
    />
    <link rel="stylesheet" href="/app.css" />
    <style>
      main { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    </style>
  </head>
  <body>
    <header>
      <div class="app-header-inner">
        <div class="app-brand-wrap">
          <a href="/">aft<span>.</span>page</a>
          <span class="nav-beta">Beta</span>
        </div>
        <div class="nav-right">
          <a href="/projects" aria-current="page">Projects</a>
          <a href="/mcp">MCP</a>
          <a class="app-cta" href="/drop">Deploy an app</a>
          <a href="/login" data-aft-auth="login">Log in</a>
        </div>
      </div>
    </header>
    <main>
      <div class="projects-hub-head">
        <h1>Projects</h1>
        <p class="projects-hub-sub">Deploy small software — use, share, claim.</p>
      </div>
      <div class="projects-toolbar" id="toolbar" hidden>
        <input
          type="text"
          class="projects-search"
          id="search"
          placeholder="Search by slug or URL…"
          aria-label="Search projects"
        />
        <a class="btn" id="deploy-btn" href="/projects/new/">Deploy</a>
      </div>
      <div class="loading" id="loading" aria-busy="true" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <div>Loading projects…</div>
      </div>
      <div class="login" id="login" hidden>
        <p>Sign in to see your projects.</p>
        <a class="primary" href="/login">Log in</a>
        <p style="margin: 0.85rem 0 0; font-size: 0.88rem">
          Or claim on the live URL after deploy.
        </p>
      </div>
      <div class="empty" id="empty" hidden>
        <p style="margin: 0 0 0.85rem; color: var(--ink); font-weight: 600;">No projects yet.</p>
        <a class="primary" href="/projects/new/">Deploy an app</a>
      </div>
      <div id="hub" hidden>
        <div class="projects-tabs" role="tablist">
          <button
            type="button"
            role="tab"
            id="tab-owned"
            aria-selected="true"
            aria-controls="panel-owned"
          >
            Owned by you
          </button>
          <button
            type="button"
            role="tab"
            id="tab-shared"
            aria-selected="false"
            aria-controls="panel-shared"
            hidden
          >
            Shared with you
          </button>
        </div>
        <div id="panel-owned" role="tabpanel" aria-labelledby="tab-owned">
          <div class="projects-grid" id="owned-grid"></div>
          <div class="msg" id="owned-msg" role="status"></div>
        </div>
        <div id="panel-shared" role="tabpanel" aria-labelledby="tab-shared" hidden>
          <div class="projects-grid" id="shared-grid"></div>
        </div>
        <div class="pager" id="pager" hidden style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.65rem; margin-top: 1rem; padding-top: 0.85rem; border-top: 1px solid var(--line);">
          <span style="font-size: 0.82rem; color: var(--quiet); margin-right: auto;" id="pager-status"></span>
          <div style="display: flex; gap: 0.4rem;">
            <button type="button" class="btn ghost" id="prev" disabled style="font-size: 0.78rem; padding: 0.3rem 0.55rem;">Previous</button>
            <button type="button" class="btn ghost" id="next" disabled style="font-size: 0.78rem; padding: 0.3rem 0.55rem;">Next</button>
          </div>
        </div>
      </div>
    </main>
    <script src="/projects-ui.js"></script>
    <script>
      const API = window.AftProjectsUI.API;
      const PAGE_SIZE = 20;
      const CACHE_TTL_MS = 60_000;
      const CACHE_KEY = "aft.projects.sites.v2";
      const loading = document.getElementById("loading");
      const login = document.getElementById("login");
      const empty = document.getElementById("empty");
      const hub = document.getElementById("hub");
      const toolbar = document.getElementById("toolbar");
      const search = document.getElementById("search");
      const deployBtn = document.getElementById("deploy-btn");
      const tabOwned = document.getElementById("tab-owned");
      const tabShared = document.getElementById("tab-shared");
      const panelOwned = document.getElementById("panel-owned");
      const panelShared = document.getElementById("panel-shared");
      const ownedGrid = document.getElementById("owned-grid");
      const sharedGrid = document.getElementById("shared-grid");
      const ownedMsg = document.getElementById("owned-msg");
      const pager = document.getElementById("pager");
      const pagerStatus = document.getElementById("pager-status");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");

      const memoryCache = new Map();
      let page = Math.max(1, Number(new URLSearchParams(location.search).get("page") || "1") || 1);
      let loadGen = 0;
      const inflightPrefetch = new Set();
      let openMenu = null;
      let openPanel = null;
      let currentTab = "owned";
      let allSites = [];
      let allShared = [];
      let searchQuery = "";

      function closeMenus() {
        if (openMenu) {
          const b = openMenu.querySelector(".menu-btn");
          if (b) b.setAttribute("aria-expanded", "false");
          openMenu = null;
        }
        if (openPanel) {
          openPanel.classList.remove("open");
          openPanel.remove();
          openPanel = null;
        }
      }

      function openActionsMenu(btn, links) {
        closeMenus();
        const panel = document.createElement("div");
        panel.className = "menu-panel open";
        panel.setAttribute("role", "menu");
        panel.innerHTML = links;
        document.body.appendChild(panel);
        const r = btn.getBoundingClientRect();
        const gap = 6;
        const pad = 8;
        const pr = panel.getBoundingClientRect();
        let top = r.bottom + gap;
        let left = r.right - pr.width;
        if (left < pad) left = pad;
        if (left + pr.width > window.innerWidth - pad) {
          left = Math.max(pad, window.innerWidth - pad - pr.width);
        }
        if (top + pr.height > window.innerHeight - pad) {
          top = Math.max(pad, r.top - pr.height - gap);
        }
        panel.style.top = `${top}px`;
        panel.style.left = `${left}px`;
        btn.setAttribute("aria-expanded", "true");
        openMenu = btn.closest(".menu");
        openPanel = panel;
        panel.addEventListener("click", (e) => e.stopPropagation());
      }

      document.addEventListener("click", closeMenus);
      window.addEventListener("resize", closeMenus);
      window.addEventListener("scroll", closeMenus, true);

      function setUrlPage(p) {
        const url = new URL(location.href);
        if (p <= 1) url.searchParams.delete("page");
        else url.searchParams.set("page", String(p));
        history.replaceState(null, "", url.pathname + url.search);
      }

      function readSessionCache() {
        try {
          const raw = sessionStorage.getItem(CACHE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return;
          for (const [k, v] of Object.entries(parsed)) {
            const p = Number(k);
            if (!Number.isFinite(p) || !v?.data || !v?.at) continue;
            memoryCache.set(p, v);
          }
        } catch (_) {}
      }

      function writeSessionCache() {
        try {
          const out = {};
          for (const [p, entry] of memoryCache) {
            out[String(p)] = entry;
          }
          sessionStorage.setItem(CACHE_KEY, JSON.stringify(out));
        } catch (_) {}
      }

      function getCached(p) {
        return memoryCache.get(p) || null;
      }

      function setCached(p, data) {
        memoryCache.set(p, { data, at: Date.now() });
        writeSessionCache();
      }

      function clearCache() {
        memoryCache.clear();
        try {
          sessionStorage.removeItem(CACHE_KEY);
        } catch (_) {}
      }

      function isFresh(entry) {
        return entry && Date.now() - entry.at < CACHE_TTL_MS;
      }

      function matchesSearch(site) {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        const slug = (site.slug || "").toLowerCase();
        const url = (site.url || `https://${slug}.aft.page`).toLowerCase();
        return slug.includes(q) || url.includes(q);
      }

      function filterSites(sites) {
        return sites.filter(matchesSearch);
      }

      function renderCard(site) {
        const card = document.createElement("div");
        card.className = "project-card" + (site.active === false ? " is-inactive" : "");
        const live = site.url || `https://${site.slug}.aft.page`;
        const manage = `/project/?slug=${encodeURIComponent(site.slug)}&tab=settings`;
        const analytics = `/project/?slug=${encodeURIComponent(site.slug)}&tab=analytics`;
        const isOwner = !site.role || site.role === "owner";
        const visMeta = window.AftProjectsUI.visibilityMeta(site);

        const link = document.createElement("a");
        link.className = "project-card-link";
        link.href = manage;
        const thumb = window.AftProjectsUI.renderThumb(site.url || live, site.slug);
        const body = document.createElement("div");
        body.className = "project-card-body";
        const title = document.createElement("h3");
        title.className = "project-card-title";
        title.textContent = site.slug;
        const meta = document.createElement("div");
        meta.className = "project-card-meta";
        const timeSpan = document.createElement("span");
        timeSpan.textContent = window.AftProjectsUI.formatRelativeTime(site.lastServedAt || site.updatedAt);
        const visSpan = document.createElement("span");
        visSpan.className = "project-card-vis";
        visSpan.innerHTML = `${window.AftProjectsUI.iconSvg(visMeta.icon)} ${visMeta.label}`;
        meta.append(timeSpan, visSpan);
        const urlDiv = document.createElement("div");
        urlDiv.className = "project-card-url";
        urlDiv.textContent = live.replace(/^https?:\/\//, "");
        body.append(title, meta, urlDiv);
        link.append(thumb, body);
        card.appendChild(link);

        const actions = document.createElement("div");
        actions.className = "project-card-actions";
        const shareBtn = document.createElement("button");
        shareBtn.type = "button";
        shareBtn.className = "btn ghost";
        shareBtn.textContent = "Share";
        shareBtn.addEventListener("click", () => {
          window.AftProjectsUI.openShareModal({
            slug: site.slug,
            url: site.url,
            visibility: site.visibility,
            role: site.role,
            ownerEmail: site.email,
            onChange: () => load(page, { force: true }),
          });
        });
        actions.appendChild(shareBtn);

        if (isOwner) {
          const menu = document.createElement("div");
          menu.className = "menu";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "menu-btn";
          btn.setAttribute("aria-label", `Actions for ${site.slug}`);
          btn.setAttribute("aria-haspopup", "menu");
          btn.setAttribute("aria-expanded", "false");
          btn.textContent = "⋯";
          const isActive = site.active !== false;
          const links = `
            <a role="menuitem" href="${live}" target="_blank" rel="noopener">Visit</a>
            <a role="menuitem" href="${manage}">Settings</a>
            <a role="menuitem" href="${analytics}">Analytics</a>
            <button type="button" role="menuitem" class="menuitem" data-action="toggle">${isActive ? "Deactivate" : "Reactivate"}</button>
            <button type="button" role="menuitem" class="menuitem" style="color: var(--danger);" data-action="delete">Delete project…</button>`;
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const expanded = btn.getAttribute("aria-expanded") === "true";
            if (expanded) {
              closeMenus();
              return;
            }
            openActionsMenu(btn, links);
            if (openPanel) {
              const tog = openPanel.querySelector('[data-action="toggle"]');
              if (tog) {
                tog.addEventListener("click", () => {
                  closeMenus();
                  setSiteActive(site.slug, !isActive);
                });
              }
              const del = openPanel.querySelector('[data-action="delete"]');
              if (del) {
                del.addEventListener("click", () => {
                  closeMenus();
                  destroyProject(site.slug);
                });
              }
            }
          });
          menu.append(btn);
          actions.appendChild(menu);
        } else {
          const menu = document.createElement("div");
          menu.className = "menu";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "menu-btn";
          btn.setAttribute("aria-label", `Actions for ${site.slug}`);
          btn.setAttribute("aria-haspopup", "menu");
          btn.setAttribute("aria-expanded", "false");
          btn.textContent = "⋯";
          const links = `
            <a role="menuitem" href="${live}" target="_blank" rel="noopener">Visit</a>
            <a role="menuitem" href="${manage}">Settings</a>
            <a role="menuitem" href="${analytics}">Analytics</a>`;
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const expanded = btn.getAttribute("aria-expanded") === "true";
            if (expanded) {
              closeMenus();
              return;
            }
            openActionsMenu(btn, links);
          });
          menu.append(btn);
          actions.appendChild(menu);
        }

        card.appendChild(actions);
        return card;
      }

      function renderGrid() {
        const owned = filterSites(allSites);
        const shared = filterSites(allShared);
        ownedGrid.replaceChildren();
        sharedGrid.replaceChildren();
        closeMenus();

        if (currentTab === "owned") {
          if (!owned.length && searchQuery) {
            ownedMsg.textContent = "No matches";
            ownedMsg.style.color = "var(--quiet)";
          } else {
            ownedMsg.textContent = "";
          }
          owned.forEach((s) => ownedGrid.appendChild(renderCard(s)));
        } else {
          shared.forEach((s) => sharedGrid.appendChild(renderCard(s)));
        }
      }

      function switchTab(tab) {
        currentTab = tab;
        if (tab === "owned") {
          tabOwned.setAttribute("aria-selected", "true");
          tabShared.setAttribute("aria-selected", "false");
          panelOwned.hidden = false;
          panelShared.hidden = true;
        } else {
          tabOwned.setAttribute("aria-selected", "false");
          tabShared.setAttribute("aria-selected", "true");
          panelOwned.hidden = true;
          panelShared.hidden = false;
        }
        renderGrid();
      }

      tabOwned.addEventListener("click", () => switchTab("owned"));
      tabShared.addEventListener("click", () => switchTab("shared"));

      search.addEventListener("input", () => {
        searchQuery = search.value.trim();
        renderGrid();
      });

      function applyData(data) {
        allSites = data.sites || [];
        allShared = data.shared || [];
        const hasOwned = data.total > 0;
        const hasShared = allShared.length > 0;
        toolbar.hidden = false;
        if (!hasOwned && !hasShared) {
          hub.hidden = true;
          empty.hidden = false;
          deployBtn.textContent = "Deploy an app";
          return false;
        }
        empty.hidden = true;
        hub.hidden = false;
        deployBtn.textContent = "Deploy";
        tabShared.hidden = !hasShared;
        renderGrid();
        const total = data.total || 0;
        const totalPages = data.totalPages || 1;
        const current = data.page || 1;
        const limit = data.limit || PAGE_SIZE;
        if (total <= limit) {
          pager.hidden = true;
        } else {
          pager.hidden = false;
          const from = (current - 1) * limit + 1;
          const to = Math.min(current * limit, total);
          pagerStatus.textContent = `${from}–${to} of ${total}`;
          prevBtn.disabled = current <= 1;
          nextBtn.disabled = !data.hasMore && current >= totalPages;
        }
        return true;
      }

      async function fetchPage(p) {
        const res = await fetch(
          `${API}/v1/me/sites?page=${p}&limit=${PAGE_SIZE}`,
          { credentials: "include" },
        );
        if (res.status === 401) return { status: 401 };
        if (!res.ok) return { status: res.status };
        const data = await res.json();
        setCached(p, data);
        return { status: 200, data };
      }

      function prefetch(p) {
        if (p < 1 || inflightPrefetch.has(p)) return;
        const cached = getCached(p);
        if (isFresh(cached)) return;
        inflightPrefetch.add(p);
        fetchPage(p)
          .catch(() => {})
          .finally(() => inflightPrefetch.delete(p));
      }

      function showAuthError() {
        clearCache();
        if (window.aftAuth) window.aftAuth.clearMe();
        loading.hidden = true;
        hub.hidden = true;
        toolbar.hidden = true;
        empty.hidden = true;
        login.hidden = false;
      }

      async function load(p = page, opts = {}) {
        const { force = false } = opts;
        const gen = ++loadGen;
        page = p;
        setUrlPage(page);
        login.hidden = true;
        const cached = !force ? getCached(page) : null;
        const haveCache = Boolean(cached?.data);
        if (haveCache) {
          loading.hidden = true;
          applyData(cached.data);
          if (isFresh(cached) && !force) {
            const totalPages = cached.data.totalPages || 1;
            if (page < totalPages) prefetch(page + 1);
            if (page > 1) prefetch(page - 1);
            return;
          }
        } else {
          loading.hidden = false;
          empty.hidden = true;
          hub.hidden = true;
          toolbar.hidden = true;
        }
        try {
          const result = await fetchPage(page);
          if (gen !== loadGen) return;
          loading.hidden = true;
          if (result.status === 401) {
            showAuthError();
            return;
          }
          if (result.status !== 200) {
            if (!haveCache) showAuthError();
            return;
          }
          const data = result.data;
          applyData(data);
          const totalPages = data.totalPages || 1;
          if (page < totalPages) prefetch(page + 1);
          if (page > 1) prefetch(page - 1);
        } catch (_) {
          if (gen !== loadGen) return;
          loading.hidden = true;
          if (!haveCache) showAuthError();
        }
      }

      async function setSiteActive(slug, active) {
        if (
          !active &&
          !window.confirm(
            `Deactivate "${slug}"?\n\nVisitors will see a paused page and the site stops serving. Your files and history are kept — you can reactivate any time.`,
          )
        ) {
          return;
        }
        try {
          const res = await fetch(
            `${API}/v1/sites/${encodeURIComponent(slug)}`,
            {
              method: "PATCH",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ active }),
            },
          );
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            window.alert(body.hint || body.error || "Couldn't update the site.");
            return;
          }
          clearCache();
          load(page, { force: true });
        } catch (_) {
          window.alert("Network error. Please try again.");
        }
      }

      async function destroyProject(slug) {
        const typed = window.prompt(
          `Destroy "${slug}"?\n\nThis permanently deletes the site, its files, and all deploy history. This cannot be undone.\n\nType the project name to confirm:`,
        );
        if (typed === null) return;
        if (typed.trim() !== slug) {
          window.alert("Name didn't match. Nothing was deleted.");
          return;
        }
        try {
          const res = await fetch(`${API}/v1/sites/${encodeURIComponent(slug)}`, {
            method: "DELETE",
            credentials: "include",
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            window.alert(body.hint || body.error || "Couldn't destroy project.");
            return;
          }
          clearCache();
          load(1, { force: true });
        } catch (_) {
          window.alert("Network error. Please try again.");
        }
      }

      prevBtn.addEventListener("click", () => {
        if (page > 1) load(page - 1);
      });
      nextBtn.addEventListener("click", () => load(page + 1));
      readSessionCache();
      load(page);
    </script>
    <script src="/auth-me.js" defer></script>
    <script src="/auth-nav.js" defer></script>
    <script src="/feedback.js" defer></script>
  </body>
</html>
