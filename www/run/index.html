<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run — aft.page</title>
    <meta
      name="description"
      content="Paste a public GitHub repo → live URL. Static, Vite, or Next.js. No account required."
    />
    <link rel="canonical" href="https://aft.page/run/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="aft.page" />
    <meta property="og:title" content="Run — aft.page" />
    <meta
      property="og:description"
      content="GitHub repo → live URL. The run button for open source."
    />
    <meta property="og:url" content="https://aft.page/run/" />
    <meta property="og:image" content="https://aft.page/og-run.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Run — aft.page. GitHub repo → live URL. The run button for open source."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Run — aft.page" />
    <meta
      name="twitter:description"
      content="Paste a public GitHub repo → live URL on aft.page."
    />
    <meta name="twitter:image" content="https://aft.page/og-run.png" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.5/index.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.2.5/index.min.css"
    />
    <link rel="stylesheet" href="/app.css" />
    <style>
      html { overflow-x: clip; }
      body { margin: 0; min-height: 100dvh; }
      .run-shell { min-height: 100dvh; display: flex; flex-direction: column; }
      .run-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      .run-bar a { color: var(--ink); text-decoration: none; font-weight: 650; letter-spacing: -0.03em; }
      .run-bar a span { opacity: 0.45; }
      .run-bar-title { margin: 0; font-size: 0.88rem; color: var(--quiet); }
      main {
        flex: 1;
        max-width: 40rem;
        width: 100%;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3rem;
        box-sizing: border-box;
      }
      .run-title {
        margin: 0 0 0.35rem;
        font-size: clamp(1.75rem, 4vw, 2.35rem);
        letter-spacing: -0.04em;
        font-weight: 650;
      }
      .run-lede { margin: 0 0 1.5rem; color: var(--quiet); font-size: 0.95rem; }
      .repo-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-family: var(--font-mono);
        font-size: 0.82rem;
        padding: 0.35rem 0.65rem;
        border: 1px solid var(--line-bright);
        border-radius: 999px;
        margin-bottom: 1rem;
      }
      .git-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        border: 1px solid var(--line-bright);
        border-radius: 0.65rem;
        background: var(--panel);
        padding: 0.45rem;
      }
      .git-row input {
        flex: 1 1 12rem;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 0.95rem;
        padding: 0.7rem 0.75rem;
      }
      .git-row input:focus { outline: none; }
      .build-panel {
        margin-top: 1.25rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        padding: 1rem 1.1rem;
        background: var(--panel);
      }
      .build-phase {
        margin: 0 0 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.82rem;
      }
      .build-log {
        margin: 0;
        max-height: 14rem;
        overflow: auto;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--bg-inset);
        border-radius: 0.4rem;
        padding: 0.65rem 0.75rem;
      }
      .msg {
        margin: 1rem 0 0;
        font-size: 0.9rem;
        min-height: 1.25em;
      }
      .msg.err { color: var(--bad, #e55); }
      .msg.ok { color: var(--good); }
      .msg.pending { color: var(--quiet); }
      .live-row { margin-top: 1rem; }
      .live-card {
        margin-top: 1.25rem;
        padding: 1.25rem 1.1rem;
        border: 1px solid var(--line-bright);
        border-radius: 0.65rem;
        background: var(--panel);
        text-align: center;
      }
      .live-eyebrow {
        margin: 0 0 0.75rem;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--good);
      }
      .live-card .btn { min-width: 10rem; }
      .live-url {
        margin: 0.75rem 0 0;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--quiet);
        word-break: break-all;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="run-shell">
      <header class="run-bar">
        <a href="/">aft<span>.</span>page</a>
        <p class="run-bar-title">Run on AFT</p>
        <a href="/drop/">Drop</a>
      </header>
      <main>
        <h1 class="run-title" id="run-title">Run a GitHub repo</h1>
        <p class="run-lede" id="run-lede">
          Public repo → detect → live URL. Static is instant; Vite and Next.js build in the background.
        </p>
        <p class="repo-chip" id="repo-chip" hidden></p>
        <form class="git-row" id="git-form">
          <label class="visually-hidden" for="git-url">GitHub URL</label>
          <input
            id="git-url"
            type="url"
            placeholder="https://github.com/owner/repo"
            autocomplete="off"
          />
          <button type="submit" class="btn" id="git-go">Run</button>
        </form>
        <div class="build-panel" id="build-panel" hidden>
          <p class="build-phase" id="build-phase">Queued</p>
          <pre class="build-log" id="build-log" aria-live="polite"></pre>
        </div>
        <p class="msg pending" id="status" role="status" aria-live="polite"></p>
        <div class="live-card" id="live-card" hidden>
          <p class="live-eyebrow">Live</p>
          <a class="btn" id="live-open" href="#" target="_blank" rel="noopener noreferrer">Open now</a>
          <p class="live-url" id="live-url-text"></p>
        </div>
      </main>
    </div>
    <script src="/run.js" defer></script>
  </body>
</html>
